<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-label="Soltura Vega Baja News">
  <defs>
    <linearGradient id="roll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4DCCB"/>
      <stop offset=".3" stop-color="#FFFDF7"/>
      <stop offset=".62" stop-color="#F4EEE1"/>
      <stop offset="1" stop-color="#C9BFAB"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A82424"/>
      <stop offset=".35" stop-color="#F03838"/>
      <stop offset="1" stop-color="#8E1E1E"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <ellipse cx="185" cy="150" rx="140" ry="12" fill="#2E3B42" opacity=".18" filter="url(#blur)"/>
  <g transform="rotate(-9 180 90)">
    <!-- left end (rounded edge) -->
    <ellipse cx="40" cy="88" rx="13" ry="40" fill="#D8CFBC"/>
    <!-- body -->
    <rect x="40" y="48" width="270" height="80" fill="url(#roll)"/>
    <!-- loose outer sheet edge -->
    <path d="M40 117 C120 121 220 120 310 116" fill="none" stroke="#BDB29C" stroke-width="1.2"/>
    <!-- masthead -->
    <line x1="58" y1="62" x2="212" y2="62" stroke="#C63232" stroke-width="2"/>
    <circle cx="70" cy="80" r="7" fill="#FBCC10"/>
    <text x="83" y="90" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-weight="700" font-size="27" fill="#2E3B42" letter-spacing="1">SOLTURA</text>
    <text x="59" y="107" font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="13.5" fill="#C63232" letter-spacing="1.4">VEGA BAJA NEWS</text>
    <line x1="58" y1="112" x2="212" y2="112" stroke="#2E3B42" stroke-width=".8" opacity=".5"/>
    <!-- columns of text -->
    <g fill="#8C969B" opacity=".55">
      <rect x="244" y="62" width="48" height="12" rx="1.5" fill="#B9C2C6"/>
      <rect x="244" y="79" width="48" height="3" rx="1.5"/>
      <rect x="244" y="86" width="42" height="3" rx="1.5"/>
      <rect x="244" y="93" width="48" height="3" rx="1.5"/>
      <rect x="244" y="100" width="36" height="3" rx="1.5"/>
      <rect x="244" y="107" width="46" height="3" rx="1.5"/>
    </g>
    <!-- red band around the roll -->
    <path d="M222 47 C226 60 226 116 222 129 L232 129 C236 116 236 60 232 47 Z" fill="url(#band)"/>
    <!-- right end: rolled spiral -->
    <ellipse cx="310" cy="88" rx="13" ry="40" fill="#F7F2E7" stroke="#BDB29C" stroke-width="1.2"/>
    <ellipse cx="310" cy="89" rx="9.5" ry="30" fill="none" stroke="#CDC3AF" stroke-width="1.1"/>
    <ellipse cx="310" cy="90" rx="6.5" ry="21" fill="none" stroke="#CDC3AF" stroke-width="1.1"/>
    <ellipse cx="310" cy="91" rx="3.5" ry="12" fill="none" stroke="#CDC3AF" stroke-width="1.1"/>
    <ellipse cx="310" cy="91" rx="1.2" ry="4" fill="#A99E88"/>
  </g>
</svg>
