name: Check downloads (tijdelijk)
on:
  push:
    paths: ['.github/workflows/check-downloads.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in Soltura-alles-in-een-tarief Soltura-all-in-fee Soltura-tarifa-todo-incluido Soltura-allt-i-ett-arvode; do
            curl -sS -o /dev/null -w "$f %{http_code} %{content_type} %{size_download}\n" https://gruposoltura.com/downloads/$f.pdf
          done
          git rm -q .github/workflows/check-downloads.yml
          git config user.name "JARVIS" && git config user.email "noreply@gruposoltura.com"
          git commit -m "tijdelijke downloadcontrole verwijderd" && git push
