name: Fetch infotorial (tijdelijk)
# Eenmalig: haalt de infotorial-PDF's van Cloudinary naar downloads/ onder de nieuwe namen en verwijdert zichzelf.
on:
  push:
    paths: ['.github/workflows/fetch-infotorial.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          B=https://res.cloudinary.com/dxmx3a2ea/raw/upload/v1792266662/soltura/assets/pdf
          curl -fsSL -o downloads/Soltura-alles-in-een-tarief.pdf $B/Grupo-Soltura-Aankoopgids.pdf
          curl -fsSL -o downloads/Soltura-all-in-fee.pdf $B/Grupo-Soltura-Purchase-Guide.pdf
          ls -la downloads
          git rm -q .github/workflows/fetch-infotorial.yml
          git config user.name "JARVIS" && git config user.email "noreply@gruposoltura.com"
          git add downloads/Soltura-alles-in-een-tarief.pdf downloads/Soltura-all-in-fee.pdf
          git commit -m "downloads: infotorial all-in fee (NL/EN) van Cloudinary overgezet"
          git push
