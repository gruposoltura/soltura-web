<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Grupo Soltura</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #faf7f2; --fg: #1d2a2f; --muted: #5c6b70; --accent: #0f5c63; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11181b; --fg: #eef2f2; --muted: #9fb0b3; --accent: #6cc3c9; } }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 34rem; margin: 18vh auto 0; padding: 0 16px; }
  h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
  p { color: var(--muted); margin: 0 0 1rem; }
  a { color: var(--accent); font-weight: 600; }
</style>
<!-- Bronversie. De build (scripts/build.mjs) vervangt dit bestand door een 404 in de site-layout met dezelfde doorverwijzing. -->
<script src="/js/routes.js"></script>
<script src="/js/resolve.js"></script>
<script>
// Oude WordPress-paden en verouderde nieuwe paden -> nieuwe URL (de Cloudflare Worker doet hetzelfde met een echte 301).
(function () {
  var get = function (u) { return fetch(u).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); };
  Promise.all([get('/redirects.json'), get('/routes.json')]).then(function (x) {
    var t = null;
    try { t = solturaResolve(location.pathname, location.search, x[0] || {}, x[1] || null); } catch (e) {}
    if (t && t !== location.pathname) { location.replace(location.origin + t + (location.hash || '')); return; }
    var nl = /^\/(nl|locatie)\//.test(location.pathname) || /^nl/i.test(navigator.language || '');
    document.getElementById('msg').hidden = false;
    document.getElementById('h').textContent = nl ? 'Deze pagina bestaat niet meer' : 'This page no longer exists';
    var a = document.getElementById('a'); a.textContent = nl ? 'Naar het woningaanbod' : 'See all homes'; a.href = nl ? '/nl/' : '/en/';
  });
})();
</script>
</head>
<body>
<main id="msg" hidden>
  <h1 id="h">This page no longer exists</h1>
  <p>Grupo Soltura · Rojales, Costa Blanca</p>
  <p><a id="a" href="/en/">See all homes</a></p>
</main>
</body>
</html>
